name: Terraform CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  backend_deploy:
    name: Terraform Backend Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::897297237979:role/GitHubOIDCRole
          role-session-name: GitHubActionsSession
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.2

      - name: Terraform Init (Backend)
        run: terraform init
        working-directory: backend

      - name: Terraform Plan (Backend)
        run: terraform plan
        working-directory: backend

      - name: Terraform Apply (Backend)
        run: terraform apply -auto-approve
        working-directory: backend

  main_infra_deploy:
    name: Terraform Main Infrastructure Deployment
    runs-on: ubuntu-latest
    needs: backend_deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::897297237979:role/GitHubOIDCRole
          role-session-name: GitHubActionsSession
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.2

      - name: Terraform Init (Main Infra)
        run: terraform init
        working-directory: main

      - name: Terraform Plan (Main Infra)
        run: terraform plan
        working-directory: main

      - name: Terraform Apply (Main Infra)
        run: terraform apply -auto-approve
        working-directory: main
